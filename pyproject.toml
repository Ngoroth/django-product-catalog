[project]
name = "django-product-catalog"
version = "0.1.0"
description = "Django product catalog take-home assignment"
readme = "README.md"
requires-python = ">=3.14.10,<3.15"
dependencies = [
    "django==6.1.2",
]

[tool.ruff]
line-length = 88
extend-exclude = [".agents"]

[tool.ruff.lint]
extend-select = ["I", "UP", "B", "DJ"]

[tool.ruff.lint.per-file-ignores]
"**/migrations/*.py" = ["RUF012"]

[dependency-groups]
dev = [
    "ruff>=0.17.3",
]
